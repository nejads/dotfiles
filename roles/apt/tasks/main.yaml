---
- name: Ensure prerequisites are installed
  become: true
  ansible.builtin.apt:
    name:
      - python3-debian
      - gpg
    state: present

- name: Ensure keyrings directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download PPA signing keys
  become: true
  ansible.builtin.shell: |
    curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ item.key_id }}" | \
      gpg --dearmor -o /etc/apt/keyrings/{{ item.name }}.gpg
  args:
    creates: "/etc/apt/keyrings/{{ item.name }}.gpg"
    executable: /bin/bash
  loop: "{{ apt_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add PPA repositories
  become: true
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: [deb]
    uris: "{{ item.uri }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: "/etc/apt/keyrings/{{ item.name }}.gpg"
    state: present
  loop: "{{ apt_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
