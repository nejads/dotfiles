---
- name: Add apt repositories
  become: true
  ansible.builtin.apt_repository:
    repo: "{{ item }}"
    state: present
    update_cache: true
  loop: "{{ apt_repos }}"

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present

- name: Install snap packages
  become: true
  community.general.snap:
    name: "{{ item }}"
    state: present
  loop: "{{ snap_packages }}"

- name: Install snap classic packages
  become: true
  community.general.snap:
    name: "{{ item }}"
    classic: true
    state: present
  loop: "{{ snap_classic_packages }}"

- name: Setup IntelliJ commandline launcher
  become: true
  ansible.builtin.file:
    src: "/snap/intellij-idea-ultimate/current/bin/idea.sh"
    path: /usr/local/bin/idea
    state: link
    force: true

- name: Install pip packages
  ansible.builtin.pip:
    name: "{{ pip_packages }}"
    extra_args: --user
    executable: pip3
  environment:
    PIP_BREAK_SYSTEM_PACKAGES: "1"

# ─── Shell-installed packages (gh, aws, sam) ────────────────────────────────────
- name: "Install {{ item.name }}"
  become: true
  ansible.builtin.shell: "{{ item.script }}"
  args:
    creates: "{{ item.binary }}"
    executable: /bin/bash
  loop: "{{ shell_packages }}"
  loop_control:
    label: "{{ item.name }}"

# ─── Amazon Corretto JDK ────────────────────────────────────────────────────────
- name: Add Amazon Corretto repository key
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://apt.corretto.aws/corretto.key | gpg --dearmor -o /usr/share/keyrings/corretto-keyring.gpg
    echo "deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main" | tee /etc/apt/sources.list.d/corretto.list
    apt update
  args:
    creates: /usr/share/keyrings/corretto-keyring.gpg
    executable: /bin/bash

- name: Install Amazon Corretto JDKs
  become: true
  ansible.builtin.apt:
    name: "{{ corretto_jdk_versions }}"
    state: present

# ─── Albert launcher ────────────────────────────────────────────────────────────
- name: Add Albert launcher repository
  become: true
  ansible.builtin.deb822_repository:
    name: home-manuelschneid3r-albert
    types: [deb]
    uris: "{{ albert_repo_url }}"
    suites: /
    signed_by: "{{ albert_repo_key }}"
    state: present
  register: albert_repo

- name: Update apt cache after adding Albert repo
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: albert_repo is changed

- name: Install Albert
  become: true
  ansible.builtin.apt:
    name: albert
    state: present
