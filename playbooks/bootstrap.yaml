---
- name: Set up Ubuntu workstation
  hosts: ubuntu
  vars:
    USERNAME: "{{ lookup('env', 'USER') }}"
    ROLES_FOLDER: "/home/{{ USERNAME }}/dotfiles/roles"
  roles:
    - role: "{{ ROLES_FOLDER }}/apt"
      tags: ["apt"]

    - role: "{{ ROLES_FOLDER }}/snap"
      tags: ["snap"]

    - role: "{{ ROLES_FOLDER }}/pip"
      tags: ["pip"]

    - role: "{{ ROLES_FOLDER }}/shell_packages"
      tags: ["shell_packages"]

    - role: "{{ ROLES_FOLDER }}/docker"
      tags: ["docker"]

    - role: "{{ ROLES_FOLDER }}/sdkman"
      tags: ["sdkman"]

    - role: "{{ ROLES_FOLDER }}/albert"
      tags: ["albert"]

    - role: "{{ ROLES_FOLDER }}/zsh"
      tags: ["zsh"]

    - role: "{{ ROLES_FOLDER }}/spaceship"
      tags: ["spaceship"]

    - role: "{{ ROLES_FOLDER }}/hosts"
      tags: ["hosts"]

    - role: "{{ ROLES_FOLDER }}/node"
      tags: ["node"]

    - role: "{{ ROLES_FOLDER }}/npm"
      tags: ["npm"]

    - role: "{{ ROLES_FOLDER }}/git"
      tags: ["git"]

    - role: "{{ ROLES_FOLDER }}/tmux"
      tags: ["tmux"]

    - role: "{{ ROLES_FOLDER }}/vim"
      tags: ["vim"]

    - role: "{{ ROLES_FOLDER }}/vscode"
      tags: ["vscode"]

    - role: "{{ ROLES_FOLDER }}/ubuntu"
      tags: ["ubuntu"]
