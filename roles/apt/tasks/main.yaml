---
- name: Ensure python3-debian is installed (required for deb822_repository)
  become: true
  ansible.builtin.apt:
    name: python3-debian
    state: present

- name: Add PPA repositories
  become: true
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: [deb]
    uris: "{{ item.uri }}"
    suites: "{{ ansible_distribution_release }}"
    components: [main]
    signed_by: "{{ item.key }}"
    state: present
  loop: "{{ apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: repos_added

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install apt packages
  become: true
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
