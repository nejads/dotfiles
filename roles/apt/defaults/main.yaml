# Packages installed via shell scripts (binary check skips if already installed)
shell_packages:
  - name: GitHub CLI
    binary: /usr/bin/gh
    script: |
      curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
      sudo apt update && sudo apt install -y gh

  - name: AWS CLI v2
    binary: /usr/local/bin/aws
    script: |
      cd /tmp
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip -o awscliv2.zip
      ./aws/install
      rm -rf aws awscliv2.zip

  - name: AWS SAM CLI
    binary: /usr/local/bin/sam
    script: |
      cd /tmp
      curl -Lo aws-sam-cli.zip https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip
      unzip -o aws-sam-cli.zip -d sam-installation
      ./sam-installation/install
      rm -rf sam-installation aws-sam-cli.zip

# Amazon Corretto JDK versions to install
corretto_jdk_versions:
  - java-25-amazon-corretto-jdk
  - java-21-amazon-corretto-jdk
  - java-17-amazon-corretto-jdk

# Albert launcher
albert_repo_url: "http://download.opensuse.org/repositories/home:/manuelschneid3r/xUbuntu_{{ ansible_distribution_version }}/"
albert_repo_key: "http://download.opensuse.org/repositories/home:/manuelschneid3r/xUbuntu_{{ ansible_distribution_version }}/Release.key"
