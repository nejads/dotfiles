---
sdkman_dir: "{{ ansible_facts['env']['HOME'] }}/.sdkman"

# Java versions to install via SDKMAN
# Uses major version prefix - SDKMAN resolves the latest patch automatically
sdkman_java_versions:
  - "25-amzn"
  - "21-amzn"
  - "17-amzn"

# Default Java version prefix
sdkman_java_default: "21-amzn"
