---
- name: Install snap packages
  become: true
  community.general.snap:
    name: "{{ item }}"
    state: present
  loop: "{{ snap_packages }}"

- name: Install snap classic packages
  become: true
  community.general.snap:
    name: "{{ item }}"
    classic: true
    state: present
  loop: "{{ snap_classic_packages }}"

- name: Setup IntelliJ commandline launcher
  become: true
  ansible.builtin.file:
    src: "/snap/intellij-idea-ultimate/current/bin/idea.sh"
    path: /usr/local/bin/idea
    state: link
    force: true
